name: Agent Governance CI

# Offline checks only. The project-management record is the Trello board (D42),
# which this workflow cannot and must not audit; no Projects credential exists.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: governance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy-tests:
    name: Policy validator tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Compile the validator
        run: python -m py_compile scripts/validate_governance.py scripts/test_validate_governance.py
      - name: Run offline governance tests
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Test document and decision checks
        run: node --test scripts/ci/governance-checks.test.mjs
      - name: Validate documents and preserve prior decision rows
        env:
          GOVERNANCE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: node scripts/ci/governance-checks.mjs

  governance:
    name: governance
    if: ${{ always() }}
    needs: [policy-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Require offline checks
        env:
          POLICY_RESULT: ${{ needs.policy-tests.result }}
        shell: bash
        run: |
          if [ "$POLICY_RESULT" != "success" ]; then
            echo "::error::Governance validator did not succeed"
            exit 1
          fi
          echo "::notice::Offline governance checks passed; no remote board audit is configured"
