name: Agent work item
# This form is an intake request, not the task record (D42). The Trello card is the
# record; no GitHub Project or label starts an agent. Do not add a Projects frontmatter key.
description: Request a task that Chief will record as a card on the Vestry Trello board.
title: "[TASK] "
body:
  - type: markdown
    attributes:
      value: >
        This issue is a request channel only. Chief records the task on the Trello
        board https://trello.com/b/JiiGuQAi/vestry and the card becomes the record.
        Ordinary implementation requires the card to be in Ready with role worker.
        If Chief cannot write the card metadata, a first handoff may be worker +
        metadata-bootstrap for metadata ONLY, then return to Chief for DoR. Never use
        both chief and worker; human is optional only when chief is present.
  - type: textarea
    id: outcome
    attributes:
      label: Outcome and why
      description: A single measurable outcome and expected behavior/user impact.
      placeholder: What will exist or behave differently after acceptance?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and exclusions
      description: Include affected components and explicit non-goals.
    validations:
      required: true
  - type: textarea
    id: baseline
    attributes:
      label: Verified baseline
      description: Repository, branch, examined commit SHA, relevant files, APIs and versions.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and blockers
      description: Record as `blocked by <Trello card id or url>` on both cards after creation; Trello dependencies are advisory.
      value: "- Dependencies: none known (verify)\n- Human-only gate: none known (verify)"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Evidence and decision context
      description: Official sources with versions/dates, approved ADR references, constraints and assumptions.
    validations:
      required: true
  - type: textarea
    id: implementation
    attributes:
      label: Detailed implementation or research recipe
      description: Enough specifics for an independent smaller Worker model to act without chat history.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Verifiable acceptance criteria
      value: |
        - [ ] Given ... When ... Then ...
        - [ ] Negative/failure case verified
        - [ ] Regression test verifies unchanged behavior
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Exact verification/evidence plan
      value: |
        - Command, environment, expected result:
        - CI workflow/check:
        - Evidence artifact/URL:
        - NOT RUN conditions:
    validations:
      required: true
  - type: textarea
    id: metadata
    attributes:
      label: Trello metadata setup and first-handoff checklist
      description: Chief specifies the exact card field values. Mark VERIFIED, TO SET, NOT REQUIRED or NOT VERIFIED. Worker must not invent values.
      value: |
        - Board: Vestry, https://trello.com/b/JiiGuQAi/vestry (board id)
        - Card id / short link: NOT VERIFIED (or exact ids)
        - Current list / target list: Backlog (verify)
        - Role text: chief / worker / worker + metadata-bootstrap
        - Priority chosen by Chief: P0 / P1 / P2 / P3 (choose with rationale)
        - Risk: Normal / Elevated / Critical; Type: exact value
        - Dependencies: `blocked by <card id or url>` / NOT REQUIRED
        - Linked PR, decision or evidence: exact URLs / NOT REQUIRED
        - Metadata actions Chief cannot perform: exact checklist
        - Worker mode: metadata-bootstrap ONLY if any readiness-critical item is unresolved
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Risk, security, rollback and approvals
      value: |
        - Risk: Normal / Elevated / Critical
        - Security/privacy/licensing/consent:
        - Owner approval required? (why):
        - Rollback/revert:
    validations:
      required: true
  - type: checkboxes
    id: governance
    attributes:
      label: Initial governance acknowledgement
      options:
        - label: I checked for duplicate cards and will have this request recorded as a card on the Vestry Trello board.
          required: true
        - label: This task starts Chief-owned. Any metadata-only Worker bootstrap must be explicitly scoped and return to Chief before implementation.
          required: true
