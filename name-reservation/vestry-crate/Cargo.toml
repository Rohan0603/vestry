[package]
name = "vestry"
version = "0.0.1"
edition = "2021"
rust-version = "1.85"
authors = ["Rohan Ponnanna"]
description = "Vestry — a durable local control plane for autonomous software engineering. Name reservation; no functional code yet."
documentation = "https://github.com/usevestry/vestry"
readme = "README.md"
homepage = "https://github.com/usevestry/vestry"
repository = "https://github.com/usevestry/vestry"
# LICENSE: deliberately unset. Choose one before publishing — `cargo publish` will reject a
# manifest with no license field, and picking a licence is the owner's decision, not mine.
# Typical for a Rust tool of this kind: license = "MIT OR Apache-2.0", plus LICENSE-MIT and
# LICENSE-APACHE files at the crate root.
keywords = ["orchestration", "agents", "automation"]
categories = ["development-tools"]
publish = true

[lib]
name = "vestry"
path = "src/lib.rs"

[dependencies]
