[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["name-reservation/vestry-crate"]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.99"

[workspace.dependencies]
# Async runtime and process supervision (LLD §3, §13).
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "io-util",
    "process",
    "sync",
    "time",
    "fs",
] }
# Durable state spine: SQLite with the bundled C library (LLD §3).
rusqlite = { version = "0.42", features = ["bundled"] }
# Serialization for manifests, evidence and NDJSON records (LLD §1, §3).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Content digests for pin and audit binding (LLD §8.4, §9).
sha2 = "0.10"
# Typed errors at crate boundaries (LLD §15).
thiserror = "2"
# Structured diagnostics; metadata-only use in Phase B (LLD §9).
tracing = "0.1"
# Stable identifiers for durable records (LLD §3).
uuid = { version = "1", features = ["v4"] }
# Win32 process, Job object and security bindings (LLD §8.4; T41 §4.4).
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
# Test-only temporary directories and files.
tempfile = "3"
